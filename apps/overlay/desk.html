<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://localhost:* http://127.0.0.1:*; style-src 'self' 'unsafe-inline' https://use.typekit.net https://p.typekit.net; font-src 'self' https://use.typekit.net; img-src 'self' data:">
<title>Pro Drive</title>
<link rel="stylesheet" href="https://use.typekit.net/pdg5yka.css">
<link rel="stylesheet" href="fonts/jetbrains-mono/jetbrains-mono.css">
<link rel="stylesheet" href="modules/desk/desk.css">
</head>
<body>
<header class="masthead">
  <div class="brand">
    <img src="images/branding/racecor-logomark-white.svg" alt="" class="brand-mark">
    <span class="brand-name">Pro Drive</span>
  </div>
  <div class="ratings" id="ratings"></div>
  <div class="stats" id="stats"></div>
  <div class="freshness">
    <span id="freshness">Connecting to the local host…</span>
    <button id="refresh" type="button" title="Reload from the local store">Refresh</button>
  </div>
</header>

<main class="desk" id="desk">
  <section class="card verdict" id="race-now"></section>
  <section class="card composure" id="composure"></section>
  <section class="card when" id="when"></section>

  <section class="card races" id="races">
    <h2>Previous races</h2>
    <div class="race-list" id="race-list"></div>
  </section>
  <section class="card detail" id="detail">
    <h2>Race</h2>
    <p class="empty">Pick a race to see its laps and incidents.</p>
  </section>

  <section class="card heatmap" id="heatmap"></section>
  <section class="card next-race" id="next-race"></section>
  <section class="card mastery" id="tracks"></section>
  <section class="card mastery" id="cars"></section>
  <section class="card dna" id="dna"></section>
  <section class="card moments" id="moments"></section>
</main>

<div class="offline" id="offline" hidden>
  <h1>No local data</h1>
  <p id="offline-reason"></p>
  <p>Pro Drive reads your history from <code>RaceCor.Host</code>. Start it with <code>npm run host</code>.</p>
</div>

<script src="modules/desk/calc.bundle.js"></script>
<script src="modules/desk/desk.js"></script>
</body>
</html>
