appId: org.racecor.broadcaster
# productName is the exe's name: dist/win-unpacked/Racing Desk.exe. One machine, one build, no installer —
# `npm run build` at the root, and the Start menu / Desktop shortcuts point at that exe.
productName: Racing Desk
copyright: Copyright (c) 2026 Kevin Conboy

files:
  - main.js
  - preload.js
  - remote-server.js
  - dashboard.html
  - desk.html
  - modules/**/*
  - images/**/*
  - fonts/**/*
  - data/**/*
  - streamdeck/racecor/com.k10motorsports.racecor.overlay.sdPlugin/**/*
  - "!streamdeck/racecor/com.k10motorsports.racecor.overlay.sdPlugin/logs/**/*"
  - "!**/node_modules/**/*"
  - node_modules/ffmpeg-static/**/*
  - "!**/tests/**/*"
  - "!**/test-results/**/*"
  - "!playwright.config.*"

# RaceCor.Host as `npm run build:host` publishes it; the app starts it from resources/host (modules/js/host-launcher.js).
extraResources:
  - from: ../host/publish
    to: host

asarUnpack:
  - node_modules/ffmpeg-static/**/*

icon: images/branding/icon.png

win:
  icon: images/branding/icon.ico
  target:
    - target: dir
      arch:
        - x64
