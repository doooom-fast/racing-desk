name: Build & Release

# Builds the Electron overlay (win-x64 + win-arm64 unpacked trees) and
# attaches them as release assets. Consumed by prodrive-windows' installer
# pipeline, which downloads the unpacked trees and bundles them into the
# combined installer.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-win:
    name: Build Overlay (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build overlay (win x64 + arm64)
        run: npx electron-builder --win --config electron-builder.yml --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack win-unpacked (x64) for downstream consumers
        shell: pwsh
        run: Compress-Archive -Path dist/win-unpacked/* -DestinationPath dist/overlay-win-unpacked.zip

      - name: Pack win-arm64-unpacked for downstream consumers
        shell: pwsh
        run: Compress-Archive -Path dist/win-arm64-unpacked/* -DestinationPath dist/overlay-win-arm64-unpacked.zip

      # ─── Stream Deck plugin ────────────────────────────────────────
      # The plugin's TypeScript source lives at
      # streamdeck/racecor/src/ and is compiled by rollup into
      # com.k10motorsports.racecor.overlay.sdPlugin/bin/plugin.js.
      # That bin/ output is gitignored (`*.sdPlugin/bin` in
      # streamdeck/racecor/.gitignore), so we MUST run the build here
      # — without it, CI ships a .sdPlugin folder with no compiled
      # JavaScript and Stream Deck loads the plugin but the actions
      # never wake up. (This was the "coming through unpacked"
      # symptom on 0.18.x / 0.19.0.)
      - name: Install Stream Deck plugin deps
        shell: pwsh
        working-directory: streamdeck/racecor
        run: npm ci

      - name: Build Stream Deck plugin (rollup → bin/plugin.js)
        shell: pwsh
        working-directory: streamdeck/racecor
        run: |
          npm run build
          $bin = "com.k10motorsports.racecor.overlay.sdPlugin/bin/plugin.js"
          if (-not (Test-Path $bin)) {
            throw "Build did not produce $bin — rollup config likely changed."
          }
          Write-Host "Built: $((Get-Item $bin).Length) bytes"

      # The host installer needs the plugin as a real on-disk folder
      # so it can copy it into Elgato's plugins dir on ssPostInstall
      # (electron-builder buries the in-overlay copy inside
      # resources/app.asar). Pack it standalone here.
      #
      # Also emit a .streamDeckPlugin file (the Elgato standard
      # distributable, a zip with that extension) so users who
      # already run Stream Deck can double-click to install without
      # the host bundle.
      - name: Pack Stream Deck plugin for downstream consumers
        shell: pwsh
        run: |
          $sdSrc = "streamdeck/racecor/com.k10motorsports.racecor.overlay.sdPlugin"
          if (-not (Test-Path "$sdSrc/manifest.json")) {
            throw "Stream Deck plugin manifest missing at $sdSrc/manifest.json"
          }
          if (-not (Test-Path "$sdSrc/bin/plugin.js")) {
            throw "Stream Deck plugin bin/plugin.js missing — build step skipped or failed."
          }
          # Wrap the .sdPlugin folder so the zip preserves the full
          # folder name when extracted (Stream Deck looks for the
          # exact com.k10motorsports.racecor.overlay.sdPlugin dir).
          New-Item -ItemType Directory -Force -Path dist/streamdeck-stage | Out-Null
          Copy-Item -Recurse -Force $sdSrc dist/streamdeck-stage/
          Compress-Archive -Path dist/streamdeck-stage/* -DestinationPath dist/streamdeck-plugin.zip
          # .streamDeckPlugin is just a renamed zip — same payload,
          # OS file association handles it through Stream Deck.
          Copy-Item dist/streamdeck-plugin.zip dist/com.k10motorsports.racecor.overlay.streamDeckPlugin
          Write-Host "Packed zip: $((Get-Item dist/streamdeck-plugin.zip).Length) bytes"
          Write-Host "Packed sdPlugin: $((Get-Item dist/com.k10motorsports.racecor.overlay.streamDeckPlugin).Length) bytes"

      - name: Upload win-unpacked (x64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: overlay-win-unpacked
          path: dist/win-unpacked/

      - name: Upload win-arm64-unpacked artifact
        uses: actions/upload-artifact@v4
        with:
          name: overlay-win-arm64-unpacked
          path: dist/win-arm64-unpacked/

      - name: Publish release with packed artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/overlay-win-unpacked.zip
            dist/overlay-win-arm64-unpacked.zip
            dist/streamdeck-plugin.zip
            dist/com.k10motorsports.racecor.overlay.streamDeckPlugin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
