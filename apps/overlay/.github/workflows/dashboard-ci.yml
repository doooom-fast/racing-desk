name: Dashboard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dashboard-tests:
    name: Dashboard Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install c8 (coverage)
        run: npm install --no-save c8@^10

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run unit tests with coverage
        run: |
          npx c8 \
            --reporter=text \
            --reporter=text-summary \
            --reporter=lcov \
            --reporter=cobertura \
            --reporter=json-summary \
            --report-dir=coverage \
            --include='*.js' \
            --include='*.mjs' \
            --include='modules/**/*.js' \
            --include='modules/**/*.mjs' \
            --include='streamdeck/**/*.js' \
            --include='streamdeck/**/*.mjs' \
            --exclude='**/*.test.*' \
            --exclude='**/*.spec.*' \
            --exclude='tests/**' \
            --exclude='node_modules/**' \
            --exclude='dist/**' \
            --exclude='coverage/**' \
            npm test

      - name: Append coverage summary to job summary
        if: always()
        run: |
          {
            echo "## Coverage (overlay unit tests)"
            echo '```'
            if [ -f coverage/coverage-summary.json ]; then
              jq -r '.total | to_entries[] | select(.key=="statements" or .key=="branches" or .key=="functions" or .key=="lines") | "\(.key|. + (" "*(11-length))) \(.value.pct)%  (\(.value.covered)/\(.value.total))"' coverage/coverage-summary.json
            else
              echo "no coverage-summary.json produced"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request' && hashFiles('coverage/cobertura-coverage.xml') != ''
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/cobertura-coverage.xml
          format: markdown
          output: both
          badge: true
          hide_complexity: true
          indicators: true

      - name: Add PR comment
        if: github.event_name == 'pull_request' && hashFiles('code-coverage-results.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: code-coverage-results.md
          header: overlay-coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-coverage
          path: coverage/
          if-no-files-found: warn
