[package]
name = "doooom-paints"
version = "0.1.0"
description = "Swap iRacing liveries"
authors = ["DOOOOM SPEEDSPORTS"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "doooom_paints_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
png = "0.18"
chrono = "0.4"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
