[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prodrive-livery"
version = "0.1.0"
description = "Agentic iRacing livery design and build pipeline (K10 Motorsports, personal tool)"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
templates = ["psd-tools>=1.9"]
dev = ["pytest>=7.4"]

[project.scripts]
livery = "livery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
livery = ["data/*.yaml", "blender/*.py", "fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
