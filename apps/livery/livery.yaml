# Local settings for this machine. Everything here can also come from the
# environment (LIVERY_CUSTOMER_ID, LIVERY_IRACING_PAINT_DIR, ...).
#
# customer_id: 123456          # your iRacing customer id — paint files are named after it
# iracing_paint_dir: "C:/Users/you/Documents/iRacing/paint"   # default: Documents/iRacing/paint

# The rig. The uninstall registry key points at a stale copy on D:, so the install is named here.
iracing_install_dir: "C:/Program Files (x86)/Steam/steamapps/common/iRacing"
blender: "C:/Program Files/Blender Foundation/Blender 4.2/blender.exe"
profiles_dir: profiles
liveries_dir: liveries
art_root: art
build_dir: build
templates_dir: templates
