# DEMO profile — not a real iRacing car.
#
# It exists so the pipeline can be built, tested and learned without shipping
# anyone's template. The layout is a plausible GT3-style sheet: both flanks
# unrolled left-to-right, horizontal panels in the middle band, ends below.
#
# Real profiles are bootstrapped from the car's own template
# (`livery profile bootstrap <car_dirpath>`) and then corrected against the zone
# overlay until `confidence: verified`.
car: _demo_gt3
display_name: Demo GT3 (synthetic template)
canvas:
  width: 2048
  height: 2048
alpha: none
px_per_meter: 440
confidence: verified
number_zones: [door.left, door.right, roof]
notes: >
  Left flank is laid out nose-left; the right flank is a separate island laid out
  nose-right, which is the common case and means neither side needs art flipped.
  rear_quarter.right is deliberately declared as a mirrored island so tests cover
  the case where the sim would otherwise show backwards lettering.

zones:
  # ---- left flank (nose at pixel-left) -----------------------------------
  side.left:
    rect: [0.0, 0.0, 1.0, 0.18]
    plane: side
    side: left
    axes: {tail: +x, down: +y}
    tags: [flank, big]
  front_fender.left:
    rect: [0.04, 0.0, 0.22, 0.18]
    plane: side
    side: left
    axes: {tail: +x, down: +y}
    tags: [flank]
  door.left:
    rect: [0.28, 0.0, 0.28, 0.18]
    plane: side
    side: left
    axes: {tail: +x, down: +y}
    tags: [flank, number]
  rear_quarter.left:
    rect: [0.58, 0.0, 0.26, 0.18]
    plane: side
    side: left
    axes: {tail: +x, down: +y}
    tags: [flank]
  rocker.left:
    rect: [0.06, 0.145, 0.78, 0.035]
    plane: side
    side: left
    axes: {tail: +x, down: +y}
    tags: [flank, small]

  # ---- right flank (nose at pixel-right) ---------------------------------
  side.right:
    rect: [0.0, 0.20, 1.0, 0.18]
    plane: side
    side: right
    axes: {tail: -x, down: +y}
    tags: [flank, big]
  front_fender.right:
    rect: [0.74, 0.20, 0.22, 0.18]
    plane: side
    side: right
    axes: {tail: -x, down: +y}
    tags: [flank]
  door.right:
    rect: [0.44, 0.20, 0.28, 0.18]
    plane: side
    side: right
    axes: {tail: -x, down: +y}
    tags: [flank, number]
  rear_quarter.right:
    rect: [0.16, 0.20, 0.26, 0.18]
    plane: side
    side: right
    # Declared with tail: +x on a right-hand panel → this island is mirrored,
    # so anything with lettering gets flipped automatically when stamped.
    axes: {tail: +x, down: +y}
    tags: [flank, mirrored]
  rocker.right:
    rect: [0.16, 0.345, 0.78, 0.035]
    plane: side
    side: right
    axes: {tail: -x, down: +y}
    tags: [flank, small]

  # ---- horizontal panels (nose toward the top of the sheet) --------------
  hood:
    rect: [0.02, 0.41, 0.30, 0.22]
    plane: top
    side: center
    axes: {tail: +y, car_right: +x}
    tags: [horizontal, big, number]
  roof:
    rect: [0.35, 0.41, 0.26, 0.22]
    plane: top
    side: center
    axes: {tail: +y, car_right: +x}
    tags: [horizontal, number]
  decklid:
    rect: [0.64, 0.41, 0.28, 0.22]
    plane: top
    side: center
    axes: {tail: +y, car_right: +x}
    tags: [horizontal]

  # ---- ends ---------------------------------------------------------------
  front:
    rect: [0.02, 0.65, 0.30, 0.16]
    plane: front
    side: center
    axes: {car_right: -x, down: +y}
    tags: [end]
  rear:
    rect: [0.35, 0.65, 0.26, 0.16]
    plane: rear
    side: center
    axes: {car_right: +x, down: +y}
    tags: [end]
  rear_wing:
    rect: [0.64, 0.65, 0.32, 0.10]
    plane: rear
    side: center
    axes: {car_right: +x, down: +y}
    tags: [end, wing]
  splitter:
    rect: [0.02, 0.83, 0.30, 0.06]
    plane: top
    side: center
    axes: {tail: +y, car_right: +x}
    tags: [aero, trim]
  glass:
    rect: [0.35, 0.83, 0.26, 0.10]
    plane: top
    side: center
    axes: {tail: +y, car_right: +x}
    tags: [glass, trim]
