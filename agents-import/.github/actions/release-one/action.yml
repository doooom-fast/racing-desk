name: Release one repo
description: Push a tag to a sibling repo, watch its release.yml run, verify assets.

inputs:
  repo:
    description: "Sibling repo name (e.g. prodrive-windows). Must live under k10-motorsports."
    required: true
  tag:
    description: "Tag to push, with v prefix (e.g. v0.18.0)."
    required: true
  token:
    description: "PAT with Contents:Read+Write and Actions:Read on the target repo."
    required: true
  workflow:
    description: "Release workflow filename on the target repo."
    required: false
    default: "release.yml"

runs:
  using: composite
  steps:
    - name: Push tag
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ORG: k10-motorsports
      run: |
        repo="${{ inputs.repo }}"
        tag="${{ inputs.tag }}"
        full="$ORG/$repo"

        # Tag whatever main currently points at. We do NOT verify cleanliness
        # — main is the team's source of truth and the orchestrator trusts it.
        sha=$(gh api "repos/$full/branches/main" --jq .commit.sha)
        if [ -z "$sha" ] || [ "$sha" = "null" ]; then
          echo "::error::Could not resolve $full main HEAD"
          exit 1
        fi
        echo "Tagging $full @ $sha as $tag"

        # Create the lightweight tag ref. POST /git/refs is what `git push`
        # ends up calling under the hood; equivalent to a tag push.
        gh api -X POST "repos/$full/git/refs" \
          -f "ref=refs/tags/$tag" \
          -f "sha=$sha" >/dev/null

    - name: Find triggered workflow run
      id: find_run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ORG: k10-motorsports
      run: |
        repo="${{ inputs.repo }}"
        tag="${{ inputs.tag }}"
        wf="${{ inputs.workflow }}"
        full="$ORG/$repo"

        # Tag pushes show the tag name in head_branch on workflow runs.
        # The release workflow is set up to fire on `push: tags: v*`, so a
        # matching run should appear within seconds of the tag push. Poll
        # for up to 60s before giving up — most runs register in <10s.
        for i in $(seq 1 12); do
          run_id=$(gh api "repos/$full/actions/workflows/$wf/runs?event=push&per_page=10" \
            --jq "[.workflow_runs[] | select(.head_branch == \"$tag\")] | .[0].id // empty")
          if [ -n "$run_id" ]; then
            echo "Found run: $run_id"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "url=https://github.com/$full/actions/runs/$run_id" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 5
        done
        echo "::error::No $wf run for tag $tag appeared on $full within 60s"
        exit 1

    - name: Watch run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ORG: k10-motorsports
      run: |
        repo="${{ inputs.repo }}"
        run_id="${{ steps.find_run.outputs.run_id }}"
        full="$ORG/$repo"
        echo "Watching $full run $run_id ..."
        # --exit-status makes a non-zero conclusion (failure/cancelled/timed_out)
        # propagate as a non-zero exit, failing this matrix leg.
        gh run watch --repo "$full" --exit-status "$run_id"

    - name: Verify release published with assets
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ORG: k10-motorsports
      run: |
        repo="${{ inputs.repo }}"
        tag="${{ inputs.tag }}"
        full="$ORG/$repo"
        # The release workflow is responsible for creating the GitHub
        # release and uploading assets. If it succeeded but produced no
        # assets, that's still a release-pipeline regression — fail.
        count=$(gh release view "$tag" --repo "$full" --json assets --jq '.assets | length' 2>/dev/null || echo "0")
        echo "$full $tag → $count asset(s)"
        if [ "$count" -lt 1 ]; then
          echo "::error::$full $tag published with zero assets"
          exit 1
        fi
