name: Release lockstep

# Orchestrates a coordinated tag push across the lockstep release repos
# and waits for each repo's own release.yml to publish assets. Wave 1
# (plugin + overlay) must finish before Wave 2 (windows [+ macos]) starts
# because the windows installer downloads plugin/overlay release assets
# at build time.
#
# Failure policy: any wave failing aborts the rest. No auto-retry, no
# auto-fix. The summary lists which repo failed; re-dispatch with the
# same or a bumped version after fixing manually.
#
# Required secret on this repo:
#   LOCKSTEP_RELEASE_PAT — fine-grained PAT with Contents: Read+Write
#   on prodrive-plugin, prodrive-overlay, prodrive-windows (and
#   prodrive-macos when re-included), plus Actions: Read.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target version, no v prefix (e.g. 0.18.0)"
        required: true
        type: string
      scope:
        description: "Comma-separated repo list (subset of plugin,overlay,windows,macos)"
        required: false
        default: "plugin,overlay,windows"
        type: string
      dry_run:
        description: "Pre-flight only — validate + print plan, push no tags"
        required: false
        default: false
        type: boolean

# One release at a time. A second dispatch waits rather than racing.
concurrency:
  group: lockstep-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  ORG: k10-motorsports
  GH_TOKEN: ${{ secrets.LOCKSTEP_RELEASE_PAT }}

jobs:
  preflight:
    name: Pre-flight
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      wave1: ${{ steps.plan.outputs.wave1 }}
      wave2: ${{ steps.plan.outputs.wave2 }}
    steps:
      - name: Validate version format
        run: |
          v="${{ inputs.version }}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH (got: $v)"
            exit 1
          fi
          echo "TAG=v$v" >> "$GITHUB_ENV"

      - name: Plan waves from scope
        id: plan
        run: |
          # Split the scope CSV, then partition by wave. Wave 1 is
          # plugin/overlay (leaves); Wave 2 is windows/macos (consumers
          # that download Wave 1 assets at build time).
          scope="${{ inputs.scope }}"
          IFS=',' read -ra parts <<< "$scope"
          wave1=()
          wave2=()
          for p in "${parts[@]}"; do
            p="${p// /}"
            case "$p" in
              plugin|overlay)        wave1+=("\"$p\"") ;;
              windows|macos)         wave2+=("\"$p\"") ;;
              "")                    : ;;
              *) echo "::error::unknown scope item: $p"; exit 1 ;;
            esac
          done
          # Compose JSON arrays for matrix consumption. Empty wave is
          # represented as `[]` so the dependent job can `if:` skip.
          w1=$(IFS=,; echo "[${wave1[*]}]")
          w2=$(IFS=,; echo "[${wave2[*]}]")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "wave1=$w1" >> "$GITHUB_OUTPUT"
          echo "wave2=$w2" >> "$GITHUB_OUTPUT"
          echo "Plan: $TAG → wave1=$w1, wave2=$w2"

      - name: Lockstep check
        run: |
          # Every repo in scope must share the same most-recent v* tag.
          # Drift means a previous release was incomplete; refuse to
          # proceed so the user can reconcile before tagging forward.
          scope="${{ inputs.scope }}"
          IFS=',' read -ra repos <<< "$scope"
          declare -a latest_tags
          for raw in "${repos[@]}"; do
            r="${raw// /}"
            [ -z "$r" ] && continue
            full="$ORG/prodrive-$r"
            tag=$(gh api "repos/$full/tags?per_page=100" \
              --jq '[.[].name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[0] // ""')
            echo "  prodrive-$r: ${tag:-<no v* tag>}"
            latest_tags+=("$tag")
          done
          uniq=$(printf "%s\n" "${latest_tags[@]}" | sort -u | wc -l | tr -d ' ')
          if [ "$uniq" != "1" ]; then
            echo "::error::Lockstep drift detected — in-scope repos do not share a common latest tag. Reconcile before re-dispatching."
            exit 1
          fi

      - name: Tag-not-already-shipped check
        run: |
          # If $TAG already exists on any in-scope repo, refuse — the
          # user picked a version that's been used. They should bump.
          scope="${{ inputs.scope }}"
          IFS=',' read -ra repos <<< "$scope"
          conflict=0
          for raw in "${repos[@]}"; do
            r="${raw// /}"
            [ -z "$r" ] && continue
            full="$ORG/prodrive-$r"
            if gh api "repos/$full/git/refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::$TAG already exists on $full"
              conflict=1
            fi
          done
          [ "$conflict" = "0" ]

      - name: Print plan
        run: |
          echo "## Release plan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Wave 1:** \`${{ steps.plan.outputs.wave1 }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Wave 2:** \`${{ steps.plan.outputs.wave2 }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dry run:** \`${{ inputs.dry_run }}\`" >> "$GITHUB_STEP_SUMMARY"

  wave1:
    name: "Wave 1 — ${{ matrix.repo }}"
    needs: preflight
    if: needs.preflight.outputs.wave1 != '[]' && !inputs.dry_run
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        repo: ${{ fromJSON(needs.preflight.outputs.wave1) }}
    steps:
      - uses: ./.github/actions/release-one
        with:
          repo: prodrive-${{ matrix.repo }}
          tag: ${{ needs.preflight.outputs.tag }}
          token: ${{ secrets.LOCKSTEP_RELEASE_PAT }}

  wave2:
    name: "Wave 2 — ${{ matrix.repo }}"
    needs: [preflight, wave1]
    if: needs.preflight.outputs.wave2 != '[]' && !inputs.dry_run
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        repo: ${{ fromJSON(needs.preflight.outputs.wave2) }}
    steps:
      - uses: ./.github/actions/release-one
        with:
          repo: prodrive-${{ matrix.repo }}
          tag: ${{ needs.preflight.outputs.tag }}
          token: ${{ secrets.LOCKSTEP_RELEASE_PAT }}

  report:
    name: Report
    needs: [preflight, wave1, wave2]
    if: always() && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        run: |
          tag="${{ needs.preflight.outputs.tag }}"
          echo "## Release ${tag} — final status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repo | Result | Assets |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          scope="${{ inputs.scope }}"
          IFS=',' read -ra repos <<< "$scope"
          for raw in "${repos[@]}"; do
            r="${raw// /}"
            [ -z "$r" ] && continue
            full="$ORG/prodrive-$r"
            count=$(gh release view "$tag" --repo "$full" --json assets --jq '.assets | length' 2>/dev/null || echo "—")
            url="https://github.com/$full/releases/tag/$tag"
            if [ "$count" != "—" ] && [ "$count" -gt 0 ]; then
              echo "| [prodrive-$r]($url) | shipped | $count |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| prodrive-$r | failed | — |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
